name: Unzip CamScannerPython.zip to Root

on:
  push:
    paths:
      - 'CamScannerPython.zip'
  workflow_dispatch:

jobs:
  unzip-job:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract and Move Files to Root
        run: |
          if [ -f "CamScannerPython.zip" ]; then
            echo "Extracting CamScannerPython.zip..."
            
            # ১. সাময়িক একটি Temp ফোল্ডারে Unzip করা হচ্ছে
            unzip -o CamScannerPython.zip -d temp_extracted/
            
            # ২. মূল Zip ফাইলটি মুছে ফেলা হচ্ছে
            rm CamScannerPython.zip
            
            # ৩. Temp ফোল্ডারের ভেতরে যদি অন্য কোনো সিঙ্গেল ফোল্ডার থাকে (যেমন CamScannerPython/), 
            # সেটির ভেতর থেকে ফাইল বের করা, অন্যথায় সরাসরি Temp থেকে ফাইল রুটে আনা
            INNER_DIR=$(find temp_extracted -mindepth 1 -maxdepth 1 -type d)
            FILE_COUNT=$(find temp_extracted -mindepth 1 -maxdepth 1 | wc -l)

            if [ "$FILE_COUNT" -eq 1 ] && [ -d "$INNER_DIR" ]; then
              echo "Moving files from inner folder ($INNER_DIR) to root..."
              shopt -s dotglob
              mv "$INNER_DIR"/* ./
            else
              echo "Moving files directly to root..."
              shopt -s dotglob
              mv temp_extracted/* ./
            fi

            # ৪. সাময়িক Temp ফোল্ডারটি মুছে ফেলা হচ্ছে
            rm -rf temp_extracted
          else
            echo "CamScannerPython.zip not found!"
            exit 1
          fi

      - name: Commit and Push Extracted Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          git commit -m "Unzipped and extracted all files directly to root" || echo "No changes to commit"
          git push
