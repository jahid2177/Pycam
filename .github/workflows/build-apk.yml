name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Pycam APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # OCR LANGUAGE DATA (ENGLISH + BENGALI)
      # Pinned official tessdata_fast release.
      # ============================================================
      - name: Prepare OCR language data
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p assets/tessdata
          for LANG in eng ben; do
            curl --location --fail --show-error --silent \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --output "assets/tessdata/${LANG}.traineddata" \
              "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/${LANG}.traineddata"
            test -s "assets/tessdata/${LANG}.traineddata"
            SIZE=$(stat -c%s "assets/tessdata/${LANG}.traineddata")
            test "$SIZE" -gt 100000
            echo "OCR ${LANG} data: ${SIZE} bytes"
          done

      # ============================================================
      # JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # HOST PYTHON
      # ============================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ============================================================
      # FAST REGRESSION TESTS
      # ============================================================
      - name: Run fast integration smoke tests
        shell: bash
        run: |
          set -euxo pipefail
          python -m compileall -q .
          python -m unittest discover -s tests -p 'test_smoke.py' -v

      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            curl \
            wget \
            ca-certificates \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            ninja-build \
            build-essential

      # ============================================================
      # RUST
      # ============================================================
      - name: Install Rust
        shell: bash
        run: |
          set -euxo pipefail

          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
          fi

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          if [ -f "$HOME/.cargo/env" ]; then
            source "$HOME/.cargo/env"
          fi

          rustc --version
          cargo --version

      # ============================================================
      # BUILDOZER / CYTHON
      # ============================================================
      - name: Install Buildozer toolchain
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==3.0.11"
          python -m pip install --upgrade buildozer

          echo "===== Versions ====="
          python --version
          python -m pip --version
          cython --version
          buildozer --version
          java -version

      # ============================================================
      # CAMERAX PROVIDER
      # ============================================================
      - name: Fetch CameraX provider
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf camerax_provider

          for ATTEMPT in 1 2 3 4; do
            echo "CameraX clone attempt $ATTEMPT/4"

            if git clone --depth 1 \
              https://github.com/Android-for-Python/camerax_provider.git \
              camerax_provider; then
              break
            fi

            rm -rf camerax_provider

            if [ "$ATTEMPT" -eq 4 ]; then
              echo "CameraX provider clone failed."
              exit 1
            fi

            sleep $((ATTEMPT * 15))
          done

          rm -rf camerax_provider/.git
          test -f camerax_provider/gradle_options.py

      # ============================================================
      # REPORTLAB 4.2.5 - PURE PYTHON VENDOR
      #
      # python-for-android v2024.01.21 still carries an old ReportLab
      # recipe pinned to hg.reportlab.com (2016), which can return HTTP 403.
      # ReportLab 4.x publishes a py3-none-any wheel, so vendor the official
      # wheel into the app source and bypass the stale p4a recipe entirely.
      # ============================================================
      - name: Vendor ReportLab 4.2.5
        shell: bash
        run: |
          set -euxo pipefail

          REPORTLAB_VERSION="4.2.5"
          REPORTLAB_WHEEL="/tmp/reportlab-${REPORTLAB_VERSION}-py3-none-any.whl"
          REPORTLAB_SHA256="eb2745525a982d9880babb991619e97ac3f661fae30571b7d50387026ca765ee"
          REPORTLAB_URL="https://files.pythonhosted.org/packages/73/12/6444906db1bc65d3a8118afb089d53c7eeca0726164f51eb3599de1d0665/reportlab-${REPORTLAB_VERSION}-py3-none-any.whl"

          rm -rf reportlab
          rm -f "$REPORTLAB_WHEEL"

          curl \
            --location \
            --fail \
            --show-error \
            --silent \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            --output "$REPORTLAB_WHEEL" \
            "$REPORTLAB_URL"

          echo "${REPORTLAB_SHA256}  ${REPORTLAB_WHEEL}" | sha256sum --check -

          python - <<'PYREPORTLAB'
          from pathlib import Path
          import zipfile

          wheel = Path('/tmp/reportlab-4.2.5-py3-none-any.whl')
          root = Path('.')
          with zipfile.ZipFile(wheel) as archive:
              members = [n for n in archive.namelist() if n.startswith('reportlab/') and not n.endswith('/')]
              if not members:
                  raise SystemExit('ReportLab package not found in wheel')
              for name in members:
                  target = root / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(name))
          PYREPORTLAB

          test -f reportlab/__init__.py
          test -f reportlab/pdfgen/canvas.py
          python - <<'PYVERIFY'
          import sys
          sys.path.insert(0, '.')
          import reportlab
          print('Vendored ReportLab:', getattr(reportlab, 'Version', getattr(reportlab, '__version__', 'unknown')))
          PYVERIFY

      # ============================================================
      # RELEASE / BUILD PREFLIGHT
      # Runs after OCR assets and CameraX hook are available, before
      # the expensive Android toolchain compilation begins.
      # ============================================================
      - name: Run Android build preflight
        shell: bash
        run: |
          set -euxo pipefail
          python .github/scripts/release_preflight.py --ci

      # ============================================================
      # FREETYPE 2.14.1 - LOCAL OVERRIDE
      #
      # Savannah is returning HTTP 502 in GitHub Actions.
      # Download the exact same FreeType release from SourceForge,
      # verify its official SHA-256, extract it, and tell p4a to use
      # the local directory instead of downloading from Savannah.
      # ============================================================
      - name: Download FreeType 2.14.1 from SourceForge
        shell: bash
        run: |
          set -euxo pipefail

          FREETYPE_VERSION="2.14.1"
          FREETYPE_ARCHIVE="/tmp/freetype-${FREETYPE_VERSION}.tar.gz"
          FREETYPE_DIR="/tmp/freetype-src"
          FREETYPE_SHA256="174d9e53402e1bf9ec7277e22ec199ba3e55a6be2c0740cb18c0ee9850fc8c34"

          rm -rf "$FREETYPE_DIR"
          rm -f "$FREETYPE_ARCHIVE"
          rm -rf "/tmp/freetype-${FREETYPE_VERSION}"

          SOURCEFORGE_URL="https://sourceforge.net/projects/freetype/files/freetype2/${FREETYPE_VERSION}/freetype-${FREETYPE_VERSION}.tar.gz/download"

          echo "Downloading FreeType ${FREETYPE_VERSION} from SourceForge..."

          curl \
            --location \
            --fail \
            --show-error \
            --silent \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            --output "$FREETYPE_ARCHIVE" \
            "$SOURCEFORGE_URL"

          echo "${FREETYPE_SHA256}  ${FREETYPE_ARCHIVE}" | sha256sum --check -

          tar -xzf "$FREETYPE_ARCHIVE" -C /tmp

          mv "/tmp/freetype-${FREETYPE_VERSION}" "$FREETYPE_DIR"

          test -f "$FREETYPE_DIR/configure"
          chmod +x "$FREETYPE_DIR/configure"

          echo "===== FreeType local source ====="
          ls -la "$FREETYPE_DIR" | head -n 30
          echo "FreeType source ready at: $FREETYPE_DIR"

      # ============================================================
      # VERIFY SPEC
      # ============================================================
      - name: Verify buildozer.spec
        shell: bash
        run: |
          set -euxo pipefail

          test -f buildozer.spec
          grep -q 'traineddata' buildozer.spec
          grep -q 'com.rmtheis:tess-two:9.1.0' buildozer.spec
          test -s assets/tessdata/eng.traineddata
          test -s assets/tessdata/ben.traineddata

          echo "===== Requirements ====="
          grep -E '^requirements[[:space:]]*=' buildozer.spec

          echo "===== Android ====="
          grep -E '^android\.api[[:space:]]*=' buildozer.spec
          grep -E '^android\.minapi[[:space:]]*=' buildozer.spec
          grep -E '^android\.ndk[[:space:]]*=' buildozer.spec
          grep -E '^android\.ndk_api[[:space:]]*=' buildozer.spec
          grep -E '^android\.archs[[:space:]]*=' buildozer.spec

          echo "===== p4a ====="
          grep -E '^p4a\.branch[[:space:]]*=' buildozer.spec
          grep -E '^p4a\.bootstrap[[:space:]]*=' buildozer.spec
          grep -E '^p4a\.hook[[:space:]]*=' buildozer.spec

          echo "===== Python pin ====="
          grep -q 'python3==3.11.5' buildozer.spec
          grep -q 'hostpython3==3.11.5' buildozer.spec

      # ============================================================
      # CLEAN OLD PROJECT BUILD
      # ============================================================
      - name: Clean stale project build
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      # ============================================================
      # CACHE GLOBAL ANDROID DOWNLOADS ONLY
      # ============================================================
      - name: Cache Android packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/packages
          key: pycam-python311-p4a20240121-reportlab-wheel-v8-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            pycam-python311-p4a20240121-reportlab-wheel-v8-${{ runner.os }}-

      # ============================================================
      # BUILD
      #
      # P4A_freetype_DIR is the critical fix. python-for-android will
      # copy this local FreeType source instead of accessing Savannah.
      # ============================================================
      - name: Build APK
        id: build_apk
        shell: bash
        env:
          P4A_freetype_DIR: /tmp/freetype-src
        run: |
          set +e
          set -o pipefail

          : > buildozer-full.log

          echo "===== Local recipe overrides =====" | tee -a buildozer-full.log
          echo "P4A_freetype_DIR=$P4A_freetype_DIR" | tee -a buildozer-full.log
          echo "ReportLab is vendored from official 4.2.5 py3-none-any wheel; p4a recipe disabled." | tee -a buildozer-full.log

          test -f "$P4A_freetype_DIR/configure" || {
            echo "Local FreeType source not found."
            exit 1
          }
          test -f reportlab/pdfgen/canvas.py || {
            echo "Vendored ReportLab source not found."
            exit 1
          }

          buildozer -v android debug 2>&1 | tee -a buildozer-full.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo "build_exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "Build failed with exit code $BUILD_EXIT."
            exit "$BUILD_EXIT"
          fi

      # ============================================================
      # VERIFY PYTHON / FREETYPE SELECTION
      # ============================================================
      - name: Verify build configuration used
        if: always()
        shell: bash
        run: |
          set +e

          echo "===== Python evidence ====="
          grep -nE \
            'Recipe python3:|Recipe hostpython3:|cpython-3\.(11|12|13|14)|python3\.(11|12|13|14)' \
            buildozer-full.log \
            | head -n 150 || true

          echo "===== FreeType evidence ====="
          grep -nEi \
            'freetype|P4A_freetype_DIR|local source|recipe source' \
            buildozer-full.log \
            | head -n 250 || true

          echo "===== ReportLab evidence ====="
          grep -nEi \
            'reportlab|hg\.reportlab\.com|files\.pythonhosted\.org' \
            buildozer-full.log \
            | head -n 250 || true

          if grep -q 'Downloading reportlab from https://hg.reportlab.com/' buildozer-full.log; then
            echo "ERROR: stale python-for-android ReportLab recipe was selected."
            exit 1
          fi

          if grep -qE \
            'v3\.(12|13|14)\.[0-9]+\.tar\.gz|cpython-3\.(12|13|14)|python3\.(12|13|14)' \
            buildozer-full.log; then
            echo "ERROR: Python 3.12+ was selected unexpectedly. Expected Python 3.11.5."
            exit 1
          fi

      # ============================================================
      # APK CHECK
      # ============================================================
      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== APK files ====="
          find bin -maxdepth 2 -type f -name '*.apk' -print

          APK_COUNT="$(find bin -maxdepth 2 -type f -name '*.apk' | wc -l)"

          if [ "$APK_COUNT" -lt 1 ]; then
            echo "No APK produced."
            exit 1
          fi

      # ============================================================
      # FAILURE DIAGNOSTICS
      # ============================================================
      - name: Create build diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p build-debug

          if [ -f buildozer-full.log ]; then
            cp buildozer-full.log build-debug/

            {
              echo "===== FREETYPE EVENTS ====="
              grep -nEi \
                'freetype|savannah|sourceforge|P4A_freetype_DIR|reportlab|hg\.reportlab\.com|pythonhosted' \
                buildozer-full.log \
                | tail -n 400 || true

              echo
              echo "===== DOWNLOAD / NETWORK EVENTS ====="
              grep -nEi \
                'https?://|download|HTTP Error|Bad Gateway|retrying|Connection|Timeout' \
                buildozer-full.log \
                | tail -n 500 || true

              echo
              echo "===== PYTHON VERSION ====="
              grep -nE \
                'Recipe python3:|Recipe hostpython3:|cpython-3\.(11|12|13|14)|python3\.(11|12|13|14)' \
                buildozer-full.log \
                | head -n 200 || true

              echo
              echo "===== LIKELY ERRORS ====="
              grep -nEi \
                'error:|fatal error:|HTTP Error|Bad Gateway|exception|traceback|failed|failure|command failed|recipe .* failed|undefined reference|no such file|could not|cannot|not found' \
                buildozer-full.log \
                | tail -n 700 || true

              echo
              echo "===== LAST 1000 LINES ====="
              tail -n 1000 buildozer-full.log || true
            } > build-debug/error-summary.txt
          fi

          find .buildozer \
            -type f \
            \( -name 'e.stdout' -o -name 'e.stderr' -o -name '*.log' \) \
            -print0 2>/dev/null \
            | while IFS= read -r -d '' FILE; do
                SAFE_NAME="$(echo "$FILE" | sed 's#^\./##; s#[/ ]#_#g')"
                cp "$FILE" "build-debug/$SAFE_NAME" 2>/dev/null || true
              done

          echo "===== Error summary preview ====="
          sed -n '1,1600p' build-debug/error-summary.txt 2>/dev/null || true

      # ============================================================
      # PACKAGE DEBUG APK / CHECKSUM / SUMMARY
      # ============================================================
      - name: Package debug APK
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release
          APK_SOURCE="$(find bin -maxdepth 2 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_SOURCE"
          cp "$APK_SOURCE" release/Pycam-Debug.apk
          (cd release && sha256sum Pycam-Debug.apk > Pycam-Debug.apk.sha256)
          SIZE_BYTES="$(stat -c%s release/Pycam-Debug.apk)"
          SIZE_MB="$(python -c 'import os; print("%.2f" % (os.path.getsize("release/Pycam-Debug.apk") / 1024 / 1024))')"
          {
            echo "## Pycam Debug APK"
            echo ""
            echo "- APK: \`Pycam-Debug.apk\`"
            echo "- Architecture: \`arm64-v8a\`"
            echo "- Size: **${SIZE_MB} MB** (${SIZE_BYTES} bytes)"
            echo "- SHA-256: \`$(cut -d' ' -f1 release/Pycam-Debug.apk.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # APK SIZE / ABI / PERMISSION AUDIT
      # ============================================================
      - name: Audit APK contents
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          APK="release/Pycam-Debug.apk"
          test -f "$APK"

          echo "===== Largest APK entries ====="
          # Avoid `sort | head` under `set -o pipefail`: head closes the pipe after
          # 30 lines and GNU sort can exit with SIGPIPE/write error even though the
          # APK is perfectly valid. Let awk consume the complete sorted stream.
          unzip -l "$APK" \
            | awk 'NR>3 && $1 ~ /^[0-9]+$/ {print $1, $4}' \
            | sort -nr \
            | awk 'NR <= 30' \
            | tee release/apk-largest-files.txt

          echo "===== ABI directories ====="
          unzip -Z1 "$APK" \
            | grep '^lib/' \
            | cut -d/ -f2 \
            | sort -u \
            | tee release/apk-abis.txt || true

          # arm64-v8a is the requested application ABI. Older tess-two AARs may
          # still contribute libtess/liblept for extra ABIs if Gradle packaging
          # exclusions are ignored by a particular toolchain. Treat only those
          # known OCR libraries as a warning; any other foreign native library is
          # a real architecture regression and must fail the build.
          unzip -Z1 "$APK" \
            | grep -E '^lib/(x86|x86_64|armeabi-v7a)/' \
            > release/apk-foreign-abi-libs.txt || true

          grep -Ev '^lib/(x86|x86_64|armeabi-v7a)/(libtess\.so|liblept\.so)$' \
            release/apk-foreign-abi-libs.txt \
            > release/apk-unexpected-foreign-abi-libs.txt || true

          if [ -s release/apk-unexpected-foreign-abi-libs.txt ]; then
            echo "ERROR: APK contains unexpected non-arm64 native libraries:"
            cat release/apk-unexpected-foreign-abi-libs.txt
            exit 1
          fi

          if [ -s release/apk-foreign-abi-libs.txt ]; then
            echo "::warning::tess-two still contributed non-arm64 Tess/Leptonica libraries. The app remains arm64-targeted, but the APK is larger than necessary."
            cat release/apk-foreign-abi-libs.txt
          fi

          SIZE_BYTES="$(stat -c%s "$APK")"
          SIZE_MB="$(python -c 'import os; print("%.2f" % (os.path.getsize("release/Pycam-Debug.apk") / 1024 / 1024))')"
          {
            echo ""
            echo "### APK size audit"
            echo ""
            echo "- Debug APK size: **${SIZE_MB} MB**"
            echo "- Packaged ABI(s): \`$(tr '\n' ' ' < release/apk-abis.txt | xargs)\`"
            echo "- Development-only test/debug directories are excluded by Buildozer."
            echo "- Video media and legacy write-storage permissions are not requested."
            echo ""
            echo "Largest packaged entries:"
            echo '```text'
            head -n 15 release/apk-largest-files.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SIZE_BYTES" -gt $((180 * 1024 * 1024)) ]; then
            echo "::warning::Debug APK is larger than 180 MB. OpenCV/Kivy/Python debug native libraries are likely the main contributors; see apk-largest-files.txt."
          fi

      # ============================================================
      # UPLOAD DEBUG APK ARTIFACT
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pycam-Debug-APK
          path: |
            release/Pycam-Debug.apk
            release/Pycam-Debug.apk.sha256
            release/apk-largest-files.txt
            release/apk-abis.txt
            release/apk-foreign-abi-libs.txt
            release/apk-unexpected-foreign-abi-libs.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # GITHUB PRERELEASE - DEBUG APK ONLY
      # ============================================================
      - name: Publish debug APK to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG="debug-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            release/Pycam-Debug.apk \
            release/Pycam-Debug.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Pycam Debug Build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated arm64-v8a debug build. No release APK is built." \
            --prerelease

      # ============================================================
      # UPLOAD FAILURE LOG
      # ============================================================
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pycam-build-error
          path: |
            buildozer-full.log
            build-debug/**
          if-no-files-found: warn
          retention-days: 14
