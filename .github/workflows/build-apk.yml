name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Pycam APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # HOST PYTHON
      # ============================================================
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ============================================================
      # LINUX DEPENDENCIES
      # ============================================================
      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            curl \
            wget \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            ninja-build \
            build-essential

      # ============================================================
      # RUST
      # ============================================================
      - name: Install Rust
        shell: bash
        run: |
          set -euxo pipefail

          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
          fi

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          if [ -f "$HOME/.cargo/env" ]; then
            source "$HOME/.cargo/env"
          fi

          rustc --version
          cargo --version

      # ============================================================
      # BUILDOZER / CYTHON
      # ============================================================
      - name: Install Buildozer toolchain
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==3.0.11"
          python -m pip install --upgrade buildozer

          echo "===== Versions ====="
          python --version
          python -m pip --version
          cython --version
          buildozer --version
          java -version

      # ============================================================
      # CAMERAX PROVIDER
      # Retry clone in case GitHub has a temporary network error.
      # ============================================================
      - name: Fetch CameraX provider
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf camerax_provider

          for ATTEMPT in 1 2 3 4; do
            echo "CameraX clone attempt $ATTEMPT/4"

            if git clone --depth 1 \
              https://github.com/Android-for-Python/camerax_provider.git \
              camerax_provider; then
              break
            fi

            rm -rf camerax_provider

            if [ "$ATTEMPT" -eq 4 ]; then
              echo "CameraX provider download failed after 4 attempts."
              exit 1
            fi

            SLEEP_TIME=$((ATTEMPT * 15))
            echo "Retrying in ${SLEEP_TIME}s..."
            sleep "$SLEEP_TIME"
          done

          rm -rf camerax_provider/.git
          test -f camerax_provider/gradle_options.py

          echo "CameraX provider OK"

      # ============================================================
      # VERIFY SPEC
      # ============================================================
      - name: Verify buildozer.spec
        shell: bash
        run: |
          set -euxo pipefail

          test -f buildozer.spec

          echo "===== Requirements ====="
          grep -E '^requirements[[:space:]]*=' buildozer.spec

          echo "===== Android ====="
          grep -E '^android\.api[[:space:]]*=' buildozer.spec
          grep -E '^android\.minapi[[:space:]]*=' buildozer.spec
          grep -E '^android\.ndk[[:space:]]*=' buildozer.spec
          grep -E '^android\.ndk_api[[:space:]]*=' buildozer.spec
          grep -E '^android\.archs[[:space:]]*=' buildozer.spec

          echo "===== p4a ====="
          grep -E '^p4a\.branch[[:space:]]*=' buildozer.spec
          grep -E '^p4a\.bootstrap[[:space:]]*=' buildozer.spec
          grep -E '^p4a\.hook[[:space:]]*=' buildozer.spec

          echo "===== Required Python pin ====="
          grep -q 'python3==3.12.11' buildozer.spec
          grep -q 'hostpython3==3.12.11' buildozer.spec

      # ============================================================
      # CLEAN OLD PROJECT BUILD
      #
      # Keep ~/.buildozer/android/packages so successfully downloaded
      # packages survive between Buildozer retry attempts.
      # ============================================================
      - name: Clean stale project build
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      # ============================================================
      # PACKAGE DOWNLOAD CACHE
      # ============================================================
      - name: Cache Android packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/packages
          key: pycam-android-python312-v5-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            pycam-android-python312-v5-${{ runner.os }}-

      # ============================================================
      # BUILD WITH RETRIES
      #
      # p4a already retries a single HTTP download a few times.
      # This outer loop retries the whole create/build operation,
      # while retaining packages already downloaded successfully.
      # This protects the build against temporary 502/503/504 errors.
      # ============================================================
      - name: Build APK with network retry
        id: build_apk
        shell: bash
        run: |
          set +e
          set -o pipefail

          : > buildozer-full.log

          MAX_ATTEMPTS=4
          BUILD_OK=0

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "" | tee -a buildozer-full.log
            echo "====================================================" | tee -a buildozer-full.log
            echo " BUILDOZER BUILD ATTEMPT $ATTEMPT/$MAX_ATTEMPTS" | tee -a buildozer-full.log
            echo "====================================================" | tee -a buildozer-full.log

            buildozer -v android debug 2>&1 \
              | tee -a buildozer-full.log

            BUILD_EXIT=${PIPESTATUS[0]}

            if [ "$BUILD_EXIT" -eq 0 ]; then
              BUILD_OK=1
              echo "Build succeeded on attempt $ATTEMPT." \
                | tee -a buildozer-full.log
              break
            fi

            echo "Build attempt $ATTEMPT failed with exit code $BUILD_EXIT." \
              | tee -a buildozer-full.log

            # If this looks like a temporary network/server problem,
            # preserve the downloaded packages and retry.
            if grep -Ei \
              'HTTP Error (429|500|502|503|504)|Bad Gateway|Service Unavailable|Gateway Timeout|Connection reset|Connection timed out|Temporary failure|RemoteDisconnected' \
              buildozer-full.log >/dev/null 2>&1; then

              if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                SLEEP_TIME=$((ATTEMPT * 30))
                echo "Temporary network/server error detected." \
                  | tee -a buildozer-full.log
                echo "Retrying complete Buildozer operation in ${SLEEP_TIME}s..." \
                  | tee -a buildozer-full.log

                sleep "$SLEEP_TIME"
                continue
              fi
            fi

            # Non-network build errors should not waste four complete
            # build attempts.
            echo "No retryable network error detected, or retry limit reached." \
              | tee -a buildozer-full.log
            break
          done

          echo "build_ok=$BUILD_OK" >> "$GITHUB_OUTPUT"

          if [ "$BUILD_OK" -ne 1 ]; then
            echo "Build failed." | tee -a buildozer-full.log
            exit 1
          fi

      # ============================================================
      # VERIFY TARGET PYTHON
      # ============================================================
      - name: Verify target Python
        if: always()
        shell: bash
        run: |
          set +e

          echo "===== Python version evidence ====="

          grep -nE \
            'cpython-3\.(12|13|14)|v3\.(12|13|14)\.[0-9]+\.tar\.gz|python3\.(12|13|14)' \
            buildozer-full.log \
            | head -n 150 || true

          if grep -qE \
            'v3\.14\.[0-9]+\.tar\.gz|cpython-3\.14|python3\.14' \
            buildozer-full.log; then
            echo "ERROR: Android Python 3.14 was selected unexpectedly."
            exit 1
          fi

      # ============================================================
      # APK CHECK
      # ============================================================
      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== APK files ====="
          find bin -maxdepth 2 -type f -name '*.apk' -print

          APK_COUNT="$(find bin -maxdepth 2 -type f -name '*.apk' | wc -l)"

          if [ "$APK_COUNT" -lt 1 ]; then
            echo "Build completed but no APK was found."
            exit 1
          fi

      # ============================================================
      # FAILURE DIAGNOSTICS
      # ============================================================
      - name: Create build diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p build-debug

          if [ -f buildozer-full.log ]; then
            cp buildozer-full.log build-debug/

            {
              echo "===== DOWNLOAD / URL EVENTS ====="

              grep -nEi \
                'https?://|download|downloading|HTTP Error|Bad Gateway|retrying|fetch|wget|curl' \
                buildozer-full.log \
                | tail -n 500 || true

              echo
              echo "===== PYTHON VERSION ====="

              grep -nE \
                'cpython-3\.(12|13|14)|v3\.(12|13|14)\.[0-9]+\.tar\.gz|python3\.(12|13|14)' \
                buildozer-full.log \
                | head -n 150 || true

              echo
              echo "===== LIKELY ERRORS ====="

              grep -nEi \
                'error:|fatal error:|HTTP Error|Bad Gateway|exception|traceback|failed|failure|command failed|recipe .* failed|undefined reference|no such file|could not|cannot|not found' \
                buildozer-full.log \
                | tail -n 600 || true

              echo
              echo "===== LAST 800 LINES ====="

              tail -n 800 buildozer-full.log || true
            } > build-debug/error-summary.txt
          fi

          # Save p4a's nested stdout/stderr/log files.
          find .buildozer \
            -type f \
            \( -name 'e.stdout' -o -name 'e.stderr' -o -name '*.log' \) \
            -print0 2>/dev/null \
            | while IFS= read -r -d '' FILE; do
                SAFE_NAME="$(echo "$FILE" | sed 's#^\./##; s#[/ ]#_#g')"
                cp "$FILE" "build-debug/$SAFE_NAME" 2>/dev/null || true
              done

          echo "===== Error summary preview ====="
          sed -n '1,1400p' build-debug/error-summary.txt 2>/dev/null || true

      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pycam-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # UPLOAD FAILURE LOG
      # ============================================================
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pycam-build-error
          path: |
            buildozer-full.log
            build-debug/**
          if-no-files-found: warn
          retention-days: 14
