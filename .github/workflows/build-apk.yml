name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Pycam APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # HOST PYTHON
      #
      # This is the Python used to run Buildozer itself.
      # Android target Python is pinned separately in buildozer.spec.
      # ============================================================
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ============================================================
      # LINUX BUILD DEPENDENCIES
      # ============================================================
      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            curl \
            wget \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            ninja-build \
            build-essential

      # ============================================================
      # RUST
      # ============================================================
      - name: Install Rust
        shell: bash
        run: |
          set -euxo pipefail

          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
          fi

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          if [ -f "$HOME/.cargo/env" ]; then
            source "$HOME/.cargo/env"
          fi

          rustc --version
          cargo --version

      # ============================================================
      # BUILDOZER + CYTHON
      #
      # Kivy 2.3.x is known to work with Cython 3.0.11.
      # Do not install unrestricted latest Cython.
      # ============================================================
      - name: Install Buildozer toolchain
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==3.0.11"
          python -m pip install --upgrade buildozer

          echo "===== Host tool versions ====="
          python --version
          python -m pip --version
          cython --version
          buildozer --version
          java -version

      # ============================================================
      # CAMERAX PROVIDER
      # ============================================================
      - name: Fetch CameraX provider
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf camerax_provider

          git clone --depth 1 \
            https://github.com/Android-for-Python/camerax_provider.git \
            camerax_provider

          rm -rf camerax_provider/.git

          test -f camerax_provider/gradle_options.py

          echo "CameraX provider OK"

      # ============================================================
      # VERIFY BUILD CONFIG
      # ============================================================
      - name: Verify buildozer.spec
        shell: bash
        run: |
          set -euxo pipefail

          test -f buildozer.spec

          echo "===== Requirements ====="
          grep -E '^requirements[[:space:]]*=' buildozer.spec

          echo "===== Android ====="
          grep -E '^android\.api[[:space:]]*=' buildozer.spec
          grep -E '^android\.minapi[[:space:]]*=' buildozer.spec
          grep -E '^android\.ndk[[:space:]]*=' buildozer.spec
          grep -E '^android\.ndk_api[[:space:]]*=' buildozer.spec
          grep -E '^android\.archs[[:space:]]*=' buildozer.spec

          echo "===== python-for-android ====="
          grep -E '^p4a\.branch[[:space:]]*=' buildozer.spec
          grep -E '^p4a\.bootstrap[[:space:]]*=' buildozer.spec
          grep -E '^p4a\.hook[[:space:]]*=' buildozer.spec

          echo "===== Critical Python pin check ====="

          grep -q 'python3==3.12.11' buildozer.spec
          grep -q 'hostpython3==3.12.11' buildozer.spec

      # ============================================================
      # CLEAN EVERYTHING THAT MAY CONTAIN PYTHON 3.14 OUTPUT
      #
      # This is essential after the failed 3.14.2 build.
      # ============================================================
      - name: Remove stale Android build
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .buildozer
          rm -rf bin

          # Remove old downloaded CPython 3.14 archives/markers if a
          # previous Actions cache contains them.
          rm -rf ~/.buildozer/android/packages/hostpython3
          rm -rf ~/.buildozer/android/packages/python3

          mkdir -p bin

      # ============================================================
      # CACHE ONLY GENERIC ANDROID DOWNLOADS
      #
      # We deliberately do not cache the local .buildozer build tree.
      # ============================================================
      - name: Cache Android downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/packages
          key: pycam-packages-python312-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build APK
        id: build_apk
        shell: bash
        run: |
          set +e
          set -o pipefail

          buildozer -v android debug 2>&1 | tee buildozer-full.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo "build_exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "Build failed with exit code: $BUILD_EXIT"
            exit "$BUILD_EXIT"
          fi

      # ============================================================
      # VERIFY THAT TARGET PYTHON WAS REALLY 3.12
      # ============================================================
      - name: Verify target Python version
        if: always()
        shell: bash
        run: |
          set +e

          echo "===== Python download/version evidence ====="

          grep -nE \
            'cpython-3\.(12|13|14)|v3\.(12|13|14)\.[0-9]+\.tar\.gz|python3\.(12|13|14)' \
            buildozer-full.log \
            | head -n 100 || true

          if grep -qE 'v3\.14\.[0-9]+\.tar\.gz|cpython-3\.14|python3\.14' buildozer-full.log; then
            echo "ERROR: Python 3.14 was selected unexpectedly."
            exit 1
          fi

      # ============================================================
      # APK RESULT
      # ============================================================
      - name: Show APK result
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== APK files ====="
          find bin -maxdepth 2 -type f -name '*.apk' -print

          APK_COUNT="$(find bin -maxdepth 2 -type f -name '*.apk' | wc -l)"

          if [ "$APK_COUNT" -lt 1 ]; then
            echo "No APK produced."
            exit 1
          fi

      # ============================================================
      # ERROR EXTRACTION
      # ============================================================
      - name: Extract build diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p build-debug

          if [ -f buildozer-full.log ]; then
            cp buildozer-full.log build-debug/

            {
              echo "===== PYTHON VERSION ====="

              grep -nE \
                'cpython-3\.(12|13|14)|v3\.(12|13|14)\.[0-9]+\.tar\.gz|python3\.(12|13|14)' \
                buildozer-full.log \
                | head -n 120 || true

              echo
              echo "===== FIRST LIKELY ERRORS ====="

              grep -nEi \
                'error:|fatal error:|exception|traceback|failed|failure|command failed|recipe .* failed|undefined reference|no such file|could not|cannot|not found' \
                buildozer-full.log \
                | head -n 400 || true

              echo
              echo "===== LAST 600 LINES ====="

              tail -n 600 buildozer-full.log || true
            } > build-debug/error-summary.txt
          fi

          # p4a may keep extra stdout/stderr files in nested directories.
          find .buildozer \
            -type f \
            \( -name 'e.stdout' -o -name 'e.stderr' -o -name '*.log' \) \
            -print0 2>/dev/null \
            | while IFS= read -r -d '' FILE; do
                SAFE_NAME="$(echo "$FILE" | sed 's#^\./##; s#[/ ]#_#g')"
                cp "$FILE" "build-debug/$SAFE_NAME" 2>/dev/null || true
              done

          echo "===== Error summary ====="
          sed -n '1,1000p' build-debug/error-summary.txt 2>/dev/null || true

      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pycam-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # UPLOAD FAILURE LOGS
      # ============================================================
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pycam-build-error
          path: |
            buildozer-full.log
            build-debug/**
          if-no-files-found: warn
          retention-days: 14
