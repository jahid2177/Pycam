name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Pycam APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # HOST PYTHON
      # ============================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            curl \
            wget \
            ca-certificates \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            ninja-build \
            build-essential

      # ============================================================
      # RUST
      # ============================================================
      - name: Install Rust
        shell: bash
        run: |
          set -euxo pipefail

          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
          fi

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          if [ -f "$HOME/.cargo/env" ]; then
            source "$HOME/.cargo/env"
          fi

          rustc --version
          cargo --version

      # ============================================================
      # BUILDOZER / CYTHON
      # ============================================================
      - name: Install Buildozer toolchain
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==3.0.11"
          python -m pip install --upgrade buildozer

          echo "===== Versions ====="
          python --version
          python -m pip --version
          cython --version
          buildozer --version
          java -version

      # ============================================================
      # CAMERAX PROVIDER
      # ============================================================
      - name: Fetch CameraX provider
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf camerax_provider

          for ATTEMPT in 1 2 3 4; do
            echo "CameraX clone attempt $ATTEMPT/4"

            if git clone --depth 1 \
              https://github.com/Android-for-Python/camerax_provider.git \
              camerax_provider; then
              break
            fi

            rm -rf camerax_provider

            if [ "$ATTEMPT" -eq 4 ]; then
              echo "CameraX provider clone failed."
              exit 1
            fi

            sleep $((ATTEMPT * 15))
          done

          rm -rf camerax_provider/.git
          test -f camerax_provider/gradle_options.py

      # ============================================================
      # FREETYPE 2.14.1 - LOCAL OVERRIDE
      #
      # Savannah is returning HTTP 502 in GitHub Actions.
      # Download the exact same FreeType release from SourceForge,
      # verify its official SHA-256, extract it, and tell p4a to use
      # the local directory instead of downloading from Savannah.
      # ============================================================
      - name: Download FreeType 2.14.1 from SourceForge
        shell: bash
        run: |
          set -euxo pipefail

          FREETYPE_VERSION="2.14.1"
          FREETYPE_ARCHIVE="/tmp/freetype-${FREETYPE_VERSION}.tar.gz"
          FREETYPE_DIR="/tmp/freetype-src"
          FREETYPE_SHA256="174d9e53402e1bf9ec7277e22ec199ba3e55a6be2c0740cb18c0ee9850fc8c34"

          rm -rf "$FREETYPE_DIR"
          rm -f "$FREETYPE_ARCHIVE"
          rm -rf "/tmp/freetype-${FREETYPE_VERSION}"

          SOURCEFORGE_URL="https://sourceforge.net/projects/freetype/files/freetype2/${FREETYPE_VERSION}/freetype-${FREETYPE_VERSION}.tar.gz/download"

          echo "Downloading FreeType ${FREETYPE_VERSION} from SourceForge..."

          curl \
            --location \
            --fail \
            --show-error \
            --silent \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            --output "$FREETYPE_ARCHIVE" \
            "$SOURCEFORGE_URL"

          echo "${FREETYPE_SHA256}  ${FREETYPE_ARCHIVE}" | sha256sum --check -

          tar -xzf "$FREETYPE_ARCHIVE" -C /tmp

          mv "/tmp/freetype-${FREETYPE_VERSION}" "$FREETYPE_DIR"

          test -f "$FREETYPE_DIR/configure"
          chmod +x "$FREETYPE_DIR/configure"

          echo "===== FreeType local source ====="
          ls -la "$FREETYPE_DIR" | head -n 30
          echo "FreeType source ready at: $FREETYPE_DIR"

      # ============================================================
      # VERIFY SPEC
      # ============================================================
      - name: Verify buildozer.spec
        shell: bash
        run: |
          set -euxo pipefail

          test -f buildozer.spec

          echo "===== Requirements ====="
          grep -E '^requirements[[:space:]]*=' buildozer.spec

          echo "===== Android ====="
          grep -E '^android\.api[[:space:]]*=' buildozer.spec
          grep -E '^android\.minapi[[:space:]]*=' buildozer.spec
          grep -E '^android\.ndk[[:space:]]*=' buildozer.spec
          grep -E '^android\.ndk_api[[:space:]]*=' buildozer.spec
          grep -E '^android\.archs[[:space:]]*=' buildozer.spec

          echo "===== p4a ====="
          grep -E '^p4a\.branch[[:space:]]*=' buildozer.spec
          grep -E '^p4a\.bootstrap[[:space:]]*=' buildozer.spec
          grep -E '^p4a\.hook[[:space:]]*=' buildozer.spec

          echo "===== Python pin ====="
          grep -q 'python3==3.11.5' buildozer.spec
          grep -q 'hostpython3==3.11.5' buildozer.spec

      # ============================================================
      # CLEAN OLD PROJECT BUILD
      # ============================================================
      - name: Clean stale project build
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      # ============================================================
      # CACHE GLOBAL ANDROID DOWNLOADS ONLY
      # ============================================================
      - name: Cache Android packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/packages
          key: pycam-python311-p4a20240121-freetype-local-v7-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            pycam-python311-p4a20240121-freetype-local-v7-${{ runner.os }}-

      # ============================================================
      # BUILD
      #
      # P4A_freetype_DIR is the critical fix. python-for-android will
      # copy this local FreeType source instead of accessing Savannah.
      # ============================================================
      - name: Build APK
        id: build_apk
        shell: bash
        env:
          P4A_freetype_DIR: /tmp/freetype-src
        run: |
          set +e
          set -o pipefail

          : > buildozer-full.log

          echo "===== Local recipe overrides =====" | tee -a buildozer-full.log
          echo "P4A_freetype_DIR=$P4A_freetype_DIR" | tee -a buildozer-full.log

          test -f "$P4A_freetype_DIR/configure" || {
            echo "Local FreeType source not found."
            exit 1
          }

          buildozer -v android debug 2>&1 | tee -a buildozer-full.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo "build_exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "Build failed with exit code $BUILD_EXIT."
            exit "$BUILD_EXIT"
          fi

      # ============================================================
      # VERIFY PYTHON / FREETYPE SELECTION
      # ============================================================
      - name: Verify build configuration used
        if: always()
        shell: bash
        run: |
          set +e

          echo "===== Python evidence ====="
          grep -nE \
            'Recipe python3:|Recipe hostpython3:|cpython-3\.(11|12|13|14)|python3\.(11|12|13|14)' \
            buildozer-full.log \
            | head -n 150 || true

          echo "===== FreeType evidence ====="
          grep -nEi \
            'freetype|P4A_freetype_DIR|local source|recipe source' \
            buildozer-full.log \
            | head -n 250 || true

          if grep -qE \
            'v3\.(12|13|14)\.[0-9]+\.tar\.gz|cpython-3\.(12|13|14)|python3\.(12|13|14)' \
            buildozer-full.log; then
            echo "ERROR: Python 3.12+ was selected unexpectedly. Expected Python 3.11.5."
            exit 1
          fi

      # ============================================================
      # APK CHECK
      # ============================================================
      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== APK files ====="
          find bin -maxdepth 2 -type f -name '*.apk' -print

          APK_COUNT="$(find bin -maxdepth 2 -type f -name '*.apk' | wc -l)"

          if [ "$APK_COUNT" -lt 1 ]; then
            echo "No APK produced."
            exit 1
          fi

      # ============================================================
      # FAILURE DIAGNOSTICS
      # ============================================================
      - name: Create build diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p build-debug

          if [ -f buildozer-full.log ]; then
            cp buildozer-full.log build-debug/

            {
              echo "===== FREETYPE EVENTS ====="
              grep -nEi \
                'freetype|savannah|sourceforge|P4A_freetype_DIR' \
                buildozer-full.log \
                | tail -n 400 || true

              echo
              echo "===== DOWNLOAD / NETWORK EVENTS ====="
              grep -nEi \
                'https?://|download|HTTP Error|Bad Gateway|retrying|Connection|Timeout' \
                buildozer-full.log \
                | tail -n 500 || true

              echo
              echo "===== PYTHON VERSION ====="
              grep -nE \
                'Recipe python3:|Recipe hostpython3:|cpython-3\.(11|12|13|14)|python3\.(11|12|13|14)' \
                buildozer-full.log \
                | head -n 200 || true

              echo
              echo "===== LIKELY ERRORS ====="
              grep -nEi \
                'error:|fatal error:|HTTP Error|Bad Gateway|exception|traceback|failed|failure|command failed|recipe .* failed|undefined reference|no such file|could not|cannot|not found' \
                buildozer-full.log \
                | tail -n 700 || true

              echo
              echo "===== LAST 1000 LINES ====="
              tail -n 1000 buildozer-full.log || true
            } > build-debug/error-summary.txt
          fi

          find .buildozer \
            -type f \
            \( -name 'e.stdout' -o -name 'e.stderr' -o -name '*.log' \) \
            -print0 2>/dev/null \
            | while IFS= read -r -d '' FILE; do
                SAFE_NAME="$(echo "$FILE" | sed 's#^\./##; s#[/ ]#_#g')"
                cp "$FILE" "build-debug/$SAFE_NAME" 2>/dev/null || true
              done

          echo "===== Error summary preview ====="
          sed -n '1,1600p' build-debug/error-summary.txt 2>/dev/null || true

      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pycam-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # UPLOAD FAILURE LOG
      # ============================================================
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pycam-build-error
          path: |
            buildozer-full.log
            build-debug/**
          if-no-files-found: warn
          retention-days: 14
