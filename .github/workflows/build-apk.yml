name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            ninja-build

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Verify buildozer.spec
        run: |
          echo "===== requirements ====="
          grep "^requirements" buildozer.spec || true

          echo "===== Android settings ====="
          grep "android.api" buildozer.spec || true
          grep "android.minapi" buildozer.spec || true
          grep "android.ndk" buildozer.spec || true
          grep "android.archs" buildozer.spec || true

      - name: Force correct Android settings
        run: |
          sed -i 's/android.ndk = 25b/android.ndk = 28c/g' buildozer.spec

          sed -i \
            's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/g' \
            buildozer.spec

          sed -i \
            's/,reportlab//g' \
            buildozer.spec

          echo "===== Updated config ====="
          grep "^requirements" buildozer.spec || true
          grep "android.ndk" buildozer.spec || true
          grep "android.archs" buildozer.spec || true

      - name: Fetch CameraX provider
        run: |
          rm -rf camerax_provider

          git clone \
            https://github.com/Android-for-Python/camerax_provider.git \
            camerax_provider

          rm -rf camerax_provider/.git

      - name: Download FreeType source
        run: |
          rm -rf /tmp/freetype-src
          rm -rf /tmp/freetype-2.14.1
          rm -f /tmp/freetype.tar.gz

          curl -L \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            -o /tmp/freetype.tar.gz \
            "https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz"

          tar -xzf /tmp/freetype.tar.gz -C /tmp

          mv /tmp/freetype-2.14.1 /tmp/freetype-src

          chmod +x /tmp/freetype-src/configure

          test -f /tmp/freetype-src/configure

          echo "FreeType source OK"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: android-build-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            android-build-${{ runner.os }}-

      - name: Remove incompatible old NDK
        run: |
          rm -rf ~/.buildozer/android/platform/android-ndk-r25b
          rm -rf .buildozer/android/platform/build-arm64-v8a_armeabi-v7a

      - name: Build APK
        env:
          P4A_freetype_DIR: /tmp/freetype-src
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          yes | buildozer -v android debug 2>&1 | tee buildozer-full.log

      - name: Show build result
        if: always()
        run: |
          echo "===== APK files ====="
          find bin -type f -maxdepth 2 -print 2>/dev/null || true

          echo "===== Last 150 log lines ====="
          tail -n 150 buildozer-full.log 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pycam-Android-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: buildozer-full.log
